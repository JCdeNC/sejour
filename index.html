<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Votre séjour à Rio · Vidigal RIO Tour</title>
<meta name="description" content="Votre programme sur mesure à Rio de Janeiro, à consulter sur votre téléphone.">
<!-- Aperçu WhatsApp / réseaux sociaux -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Vidigal RIO Tour">
<meta property="og:title" content="Vidigal RIO Tour, votre séjour à Rio !">
<meta property="og:description" content="Votre programme sur mesure à Rio de Janeiro, à consulter sur votre téléphone.">
<meta property="og:image" content="https://static.wixstatic.com/media/c046ee_46f672c0de4949a49c74185394cd4271~mv2.jpeg/v1/fill/w_1200,h_630,al_c,q_85/vignette.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="https://jcdenc.github.io/studio-devis/favicon.png">
<link rel="apple-touch-icon" href="https://jcdenc.github.io/studio-devis/apple-touch-icon.png">
<meta name="theme-color" content="#F4EFE8">
<link rel="preload" as="image" href="kombi-attente.webp" type="image/webp">
<style>
  html,body{margin:0;height:100%;background:#F4EFE8;font-family:Poppins,system-ui,-apple-system,sans-serif;color:#350A07}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  .cache{display:none}
  /* écran d'attente : le Kombi dessiné qui roule (dessin original détouré), messages */
  #attente{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:#F4EFE8;transition:opacity .5s ease}
  #attente.fini{opacity:0;pointer-events:none}
  #attente .titre{margin:0;font-weight:600;font-size:18px}
  #attente .msg{margin:0;max-width:340px;font-size:14.5px;line-height:1.55;color:#6E5B55;min-height:2.6em;transition:opacity .4s}
  #attente a{color:#A34C0C;font-weight:600}
  .scene{position:relative;width:min(380px,88vw);aspect-ratio:640/465}
  .scene picture,.scene img{position:absolute;inset:0;width:100%;height:100%;display:block}
  .scene .k{animation:cahot 1s ease-in-out infinite;transform-origin:50% 88%;z-index:2}
  .scene .s{animation:vibre .24s steps(2) infinite}
  .scene .trait{position:absolute;left:-4%;height:4px;border-radius:4px;background:linear-gradient(90deg,rgba(139,58,26,0),#8B3A1A);opacity:0;z-index:1;animation:vitesse .9s linear infinite}
  .scene .t1{top:38%;width:20%}.scene .t2{top:52%;width:26%;animation-delay:.3s}.scene .t3{top:66%;width:16%;animation-delay:.6s}
  .scene .poussiere{position:absolute;left:9%;top:78%;width:7%;aspect-ratio:1;border-radius:50%;background:#D9CBBB;opacity:0;z-index:1;animation:poussiere 1.1s ease-out infinite}
  .scene .p2{left:52%;top:80%;animation-delay:.55s}
  @keyframes cahot{0%,100%{transform:translateY(0) rotate(0)}18%{transform:translateY(-3.2%) rotate(-1.4deg)}38%{transform:translateY(-.6%) rotate(.5deg)}58%{transform:translateY(-2.4%) rotate(-.9deg)}78%{transform:translateY(-.4%) rotate(.3deg)}}
  @keyframes vibre{0%{transform:translateX(0)}100%{transform:translateX(-1.2%)}}
  @keyframes vitesse{0%{transform:translateX(30%) scaleX(.3);opacity:0}25%{opacity:.75}100%{transform:translateX(-120%) scaleX(1);opacity:0}}
  @keyframes poussiere{0%{transform:translate(0,0) scale(.3);opacity:.7}100%{transform:translate(-180%,-60%) scale(1.8);opacity:0}}
  @media (prefers-reduced-motion: reduce){.scene .k,.scene .s,.scene .trait,.scene .poussiere{animation:none}}
</style>
</head>
<body>
<!-- Devis en ligne de Studio Devis, en plein écran sans le bandeau Google.
     Lien envoyé au client : https://sejour.vidigalriotour.com/?VRT-2026-2302-3.XXXXXXXXXX (ancien format ?n=…&t=… accepté)
     Pendant le chargement (parfois long) : le Kombi dessiné qui roule (kombi-attente.webp / .png, sol : kombi-attente-sol.*). -->
<div id="attente" role="status" aria-live="polite">
  <div class="scene" aria-hidden="true">
    <span class="trait t1"></span><span class="trait t2"></span><span class="trait t3"></span>
    <span class="poussiere"></span><span class="poussiere p2"></span>
    <picture class="s"><source srcset="kombi-attente-sol.webp" type="image/webp"><img src="kombi-attente-sol.png" alt=""></picture>
    <picture class="k"><source srcset="kombi-attente.webp" type="image/webp"><img src="kombi-attente.png" alt="Le Kombi de Vidigal RIO Tour"></picture>
  </div>
  <p class="titre">Votre séjour à Rio arrive…</p>
  <p class="msg" id="msg">Ouverture de votre devis</p>
</div>
<iframe id="devis" class="cache" title="Votre devis Vidigal RIO Tour" allow="clipboard-write"></iframe>
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbxeyKjx23vcqD-TznZmXY7iJRazkMO6igeKWf1zziFY--8cTFnFez0k9Uw1tJbNmD6KFw/exec';
  var q = new URLSearchParams(location.search), n = q.get('n') || q.get('devis'), t = q.get('t');
  if (!n) {   // lien court : sejour.vidigalriotour.com/?VRT-2026-2302-3.QJ_TDTMFis
    var m = decodeURIComponent(location.search.slice(1) || location.hash.slice(1)).match(/^([A-Za-z0-9-]+)\.([\w-]{10,})$/);
    if (m) { n = m[1]; t = m[2]; }
  }
  var msg = document.getElementById('msg'), attente = document.getElementById('attente');
  function dire(txt) { msg.style.opacity = 0; setTimeout(function () { msg.innerHTML = txt; msg.style.opacity = 1; }, 400); }
  if (n && t) {
    var adresse = APP + '?n=' + encodeURIComponent(n) + '&t=' + encodeURIComponent(t);
    var f = document.getElementById('devis'), pret = false;
    // messages qui changent si le chargement dure
    var etapes = [[4000, 'Nous préparons votre programme, jour par jour'], [9000, 'Chargement des photos de vos expériences'],
      [16000, 'Encore un petit instant, la Kombi arrive !'],
      [30000, 'Le chargement prend plus de temps que d’habitude.<br>Si rien ne s’affiche, <a href="' + adresse + '">ouvrez le devis ici</a>.']];
    etapes.forEach(function (e) { setTimeout(function () { if (!pret) dire(e[1]); }, e[0]); });
    f.onload = function () {
      pret = true;
      f.classList.remove('cache');
      attente.classList.add('fini');
      setTimeout(function () { attente.classList.add('cache'); }, 600);
    };
    f.src = adresse;
  } else {
    document.querySelector('#attente .titre').textContent = 'Lien incomplet';
    msg.textContent = 'Ce lien n’est pas complet. Demandez un nouveau lien à votre guide.';
    document.querySelector('#attente .scene').classList.add('cache');
  }
</script>
</body>
</html>
