<style>
  html,body{margin:0;height:100%;background:#F4EFE8;font-family:Poppins,system-ui,-apple-system,sans-serif;color:#350A07}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  .msg{max-width:420px;margin:30vh auto 0;padding:0 24px;text-align:center;font-size:15px;line-height:1.6}
  .cache{display:none}
</style>
</head>
<body>
<!-- Devis en ligne de Studio Devis, en plein écran sans le bandeau Google.
     Lien envoyé au client : https://sejour.vidigalriotour.com/?n=VRT-2026-2302-3&t=XXXXXXXXXX -->
<iframe id="devis" class="cache" title="Votre devis Vidigal RIO Tour" allow="clipboard-write"></iframe>
<p class="msg" id="msg">Ouverture de votre devis…</p>
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbxeyKjx23vcqD-TznZmXY7iJRazkMO6igeKWf1zziFY--8cTFnFez0k9Uw1tJbNmD6KFw/exec';
  var q = new URLSearchParams(location.search), n = q.get('n') || q.get('devis'), t = q.get('t');
  if (n && t) {
    var f = document.getElementById('devis');
    f.src = APP + '?n=' + encodeURIComponent(n) + '&t=' + encodeURIComponent(t);
    f.onload = function () { document.getElementById('msg').classList.add('cache'); f.classList.remove('cache'); };
  } else {
    document.getElementById('msg').textContent = 'Ce lien n’est pas complet. Demandez un nouveau lien à votre guide.';
  }
</script>
</body>
